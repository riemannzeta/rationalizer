<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}News Rationalizer{% endblock %}</title>
    <style>
        /* Tufte-inspired CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            font-size: 16px;
            line-height: 1.6;
            color: #222;
            background-color: #fffff8;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 400;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        h1 {
            font-size: 2.5rem;
            margin-top: 0;
        }

        h2 {
            font-size: 1.8rem;
            border-bottom: 1px solid #ccc;
            padding-bottom: 0.3rem;
            margin-top: 2rem;
        }

        h3 {
            font-size: 1.3rem;
            font-style: italic;
        }

        a {
            color: #004080;
            text-decoration: none;
            border-bottom: 1px solid #ccc;
        }

        a:hover {
            color: #0066cc;
            border-bottom: 1px solid #0066cc;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #222;
        }

        .nav {
            text-align: center;
            margin: 2rem 0;
            padding: 1rem 0;
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
        }

        .nav a {
            margin: 0 1rem;
            border: none;
            font-variant: small-caps;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .stat-box {
            padding: 1rem;
            border-left: 3px solid #004080;
            background-color: #f9f9f9;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #004080;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .valence-bar {
            width: 100%;
            height: 30px;
            background: linear-gradient(to right, #d32f2f 0%, #999 50%, #388e3c 100%);
            position: relative;
            margin: 1rem 0;
            border: 1px solid #666;
        }

        .valence-marker {
            position: absolute;
            top: -5px;
            width: 2px;
            height: 40px;
            background-color: #000;
        }

        .valence-label {
            position: absolute;
            top: 35px;
            transform: translateX(-50%);
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .author-ranking {
            margin: 2rem 0;
        }

        .author-row {
            display: flex;
            align-items: center;
            margin: 0.5rem 0;
            padding: 0.5rem;
            border-bottom: 1px solid #eee;
        }

        .author-row:hover {
            background-color: #f5f5f5;
        }

        .author-name {
            flex: 0 0 250px;
            font-weight: 500;
        }

        .author-bar-container {
            flex: 1;
            position: relative;
            height: 20px;
        }

        .author-bar {
            position: absolute;
            height: 100%;
            opacity: 0.7;
        }

        .author-bar.positive {
            background-color: #388e3c;
            left: 50%;
        }

        .author-bar.negative {
            background-color: #d32f2f;
            right: 50%;
        }

        .author-score {
            flex: 0 0 60px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-size: 0.9rem;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        .category-card {
            border: 1px solid #ccc;
            padding: 1.5rem;
            background-color: #fff;
        }

        .category-card h3 {
            margin-top: 0;
            font-style: normal;
            font-size: 1.2rem;
        }

        .complementary-pair {
            margin: 1.5rem 0;
            padding: 1rem;
            background-color: #f9f9f9;
            border-left: 3px solid #004080;
        }

        .pair-authors {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }

        .pair-negative {
            color: #d32f2f;
            font-weight: 500;
        }

        .pair-positive {
            color: #388e3c;
            font-weight: 500;
        }

        .pair-divider {
            font-size: 1.5rem;
            color: #999;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
        }

        th, td {
            padding: 0.5rem;
            text-align: left;
            border-bottom: 1px solid #ccc;
        }

        th {
            font-weight: 600;
            background-color: #f5f5f5;
        }

        .article-list {
            margin: 1rem 0;
        }

        .article-item {
            margin: 1rem 0;
            padding: 1rem;
            border-left: 2px solid #ccc;
        }

        .article-title {
            font-weight: 500;
            font-size: 1.05rem;
        }

        .article-meta {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.3rem;
        }

        .sidenote {
            font-size: 0.9rem;
            color: #666;
            font-style: italic;
            margin: 1rem 0;
            padding-left: 1rem;
            border-left: 2px solid #ccc;
        }

        .method-box {
            background-color: #f0f0f0;
            padding: 1.5rem;
            margin: 2rem 0;
            border: 1px solid #ccc;
        }

        code {
            background-color: #f5f5f5;
            padding: 0.2rem 0.4rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .footer {
            margin-top: 4rem;
            padding-top: 1rem;
            border-top: 1px solid #ccc;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="/" style="border: none;">News Rationalizer</a></h1>
        <p>Measuring Emotional Valence in News Coverage</p>
    </div>

    <nav class="nav">
        <a href="/">Home</a>
        <a href="/rankings/">Balance Rankings</a>
        <a href="/about/">About</a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>News Rationalizer &mdash; An experimental analysis of emotional valence in journalism</p>
    </footer>
</body>
</html>
