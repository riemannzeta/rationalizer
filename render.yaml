services:
  - type: web
    name: news-rationalizer
    env: python
    buildCommand: "uv sync && uv run python manage.py migrate && uv run python manage.py collectstatic --noinput"
    startCommand: "uv run gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"
    plan: free
